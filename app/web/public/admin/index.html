<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도서관 운영</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="admin-top">
    <div class="who"><strong id="org"></strong> <span id="login-id" class="muted"></span></div>
    <button type="button" id="logout" class="btn">로그아웃</button>
  </header>

  <nav class="tabs" aria-label="관리 화면">
    <button type="button" class="tab" data-tab="chat" id="tab-chat">AI 도우미</button>
    <button type="button" class="tab" data-tab="approvals" id="tab-approvals">승인 목록 <span id="pending-count" class="badge" hidden></span></button>
    <button type="button" class="tab" data-tab="requests" id="tab-requests">희망도서</button>
    <button type="button" class="tab" data-tab="overdue" id="tab-overdue" hidden>오늘의 연체</button>
    <button type="button" class="tab" data-tab="imports" id="tab-imports" hidden>책 가져오기</button>
    <button type="button" class="tab" data-tab="collection" id="tab-collection" hidden>책 목록</button>
    <button type="button" class="tab" data-tab="members" id="tab-members">회원</button>
    <button type="button" class="tab" data-tab="closures" id="tab-closures">휴관일</button>
  </nav>

  <main class="admin-main">
    <section id="panel-chat" class="panel" data-panel="chat" hidden>
      <div id="chat-thread" class="thread" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="500" placeholder="예: 이번 달 대출이 많은 분야 알려줘" aria-label="AI 도우미에게 질문" autocomplete="off">
        <button type="submit" id="chat-send" class="primary">보내기</button>
        <button type="button" id="chat-new" class="btn">새 대화</button>
      </form>
    </section>

    <section id="panel-approvals" class="panel" data-panel="approvals" hidden>
      <div class="view-switch" role="group" aria-label="보기">
        <button type="button" class="btn" id="view-pending" aria-pressed="true">승인 대기</button>
        <button type="button" class="btn" id="view-all" aria-pressed="false">전체</button>
      </div>
      <p id="approvals-note" class="error-line" role="alert"></p>
      <section class="group" data-kind="curations"><h2>큐레이션</h2><ul class="list" id="list-curations"></ul></section>
      <section class="group" data-kind="templates" id="group-templates" hidden><h2>연체 안내 양식</h2><ul class="list" id="list-templates"></ul></section>
      <section class="group" data-kind="purchases"><h2>구매 요청서</h2><ul class="list" id="list-purchases"></ul></section>
    </section>

    <section id="panel-requests" class="panel" data-panel="requests" hidden>
      <h2>처리 전 희망도서</h2>
      <ul class="list" id="list-requests"></ul>
      <button type="button" id="more-requests" class="btn" hidden>더 보기</button>
    </section>

    <section id="panel-overdue" class="panel" data-panel="overdue" hidden>
      <h2>오늘의 연체 안내</h2>
      <p id="overdue-summary" class="muted"></p>
      <ul class="list" id="list-overdue"></ul>
    </section>

    <section id="panel-imports" class="panel" data-panel="imports" hidden>
      <h2>책 목록 파일 올리기</h2>
      <form id="import-form" class="import-form">
        <input id="import-file" type="file" accept=".xlsx,.xls,.csv,.txt" aria-label="책 목록 파일(xlsx, CSV)" required>
        <button type="submit" id="import-submit" class="primary">올리기</button>
      </form>
      <div id="import-columns" class="import-columns"></div>
      <p id="import-error" class="error-line" role="alert"></p>
      <div id="import-summary"></div>
      <h2>지난 가져오기</h2>
      <ul class="list" id="list-imports"></ul>
    </section>

    <section id="panel-collection" class="panel" data-panel="collection" hidden>
      <div class="toolbar">
        <form id="collection-form" class="search-form" autocomplete="off">
          <input id="collection-q" type="text" maxlength="100" placeholder="도서명·저자·등록번호" aria-label="도서명, 저자, 등록번호" autocomplete="off">
          <button type="submit" class="primary">찾기</button>
          <button type="button" id="collection-all" class="btn" hidden>전체 보기</button>
        </form>
        <button type="button" id="register-open" class="btn">책 등록</button>
      </div>
      <form id="register-form" class="entry-form" autocomplete="off" novalidate hidden>
        <label>ISBN <input id="register-isbn" type="text" maxlength="20" autocomplete="off"></label>
        <p id="register-found" class="entry-wide muted" hidden></p>
        <label id="register-title-field">도서명 <input id="register-title" type="text" autocomplete="off"></label>
        <label id="register-author-field">저자 <input id="register-author" type="text" autocomplete="off"></label>
        <label>등록번호 <input id="register-accession" type="text" autocomplete="off"></label>
        <label>청구기호 <input id="register-call" type="text" autocomplete="off"></label>
        <label>입수 구분
          <select id="register-acquisition">
            <option value="purchased">매입</option>
            <option value="donated">기증</option>
          </select>
        </label>
        <label id="register-price-field">구입가 <input id="register-price" type="number" min="0" step="1" inputmode="numeric" autocomplete="off"></label>
        <label id="register-donor-field" hidden>기증처 <input id="register-donor" type="text" autocomplete="off"></label>
        <div class="entry-wide detail-actions">
          <button type="submit" id="register-submit" class="primary">등록</button>
          <button type="button" id="register-close" class="btn">닫기</button>
        </div>
        <p id="register-error" class="entry-wide error-line" role="alert"></p>
      </form>
      <p id="collection-error" class="error-line" role="alert"></p>
      <div id="collection-table" class="table-wrap"></div>
      <button type="button" id="collection-more" class="btn" hidden>더 보기</button>
    </section>

    <section id="panel-members" class="panel" data-panel="members" hidden>
      <div class="toolbar">
        <form id="member-search" class="search-form" autocomplete="off">
          <input id="member-q" type="text" maxlength="100" placeholder="이름·회원번호" aria-label="이름, 회원번호" autocomplete="off">
          <button type="submit" class="primary">찾기</button>
        </form>
        <button type="button" id="member-open" class="btn">회원 등록</button>
      </div>
      <form id="member-form" class="entry-form" autocomplete="off" novalidate hidden>
        <label>회원번호 <input id="member-number" type="text" autocomplete="off"></label>
        <label>이름 <input id="member-name" type="text" autocomplete="off"></label>
        <label>휴대폰 번호 <input id="member-phone" type="tel" autocomplete="off"></label>
        <div class="entry-wide detail-actions">
          <button type="submit" id="member-submit" class="primary">등록</button>
          <button type="button" id="member-close" class="btn">닫기</button>
        </div>
        <p id="member-form-error" class="entry-wide error-line" role="alert"></p>
      </form>
      <p id="member-error" class="error-line" role="alert"></p>
      <div id="member-table" class="table-wrap"></div>
      <button type="button" id="member-more" class="btn" hidden>더 보기</button>
    </section>

    <section id="panel-closures" class="panel" data-panel="closures" hidden>
      <h2>임시 휴관일</h2>
      <form id="closure-form" class="search-form" autocomplete="off">
        <input id="closure-date" type="date" aria-label="휴관 날짜" required autocomplete="off">
        <input id="closure-reason" type="text" maxlength="100" placeholder="사유" aria-label="휴관 사유" autocomplete="off">
        <button type="submit" id="closure-submit" class="primary">등록</button>
      </form>
      <p id="closure-error" class="error-line" role="alert"></p>
      <div id="closure-table" class="table-wrap"></div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
