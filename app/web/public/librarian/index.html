<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 사서</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./librarian.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div id="due" class="due" hidden></div>
      <div class="top-actions">
        <button type="button" id="open-loan" class="btn" hidden>대출·반납</button>
        <button type="button" id="open-request" class="btn">희망도서 신청</button>
        <button type="button" id="basket-toggle" class="btn basket-toggle" aria-controls="basket" hidden>
          담은 책 <span id="basket-count">0</span>
        </button>
        <button type="button" id="new-chat" class="btn">새 대화</button>
        <button type="button" id="open-login" class="btn">회원 로그인</button>
        <span id="member-status" class="member-status" hidden>로그인 중</span>
        <button type="button" id="member-logout" class="btn" hidden>로그아웃</button>
        <a id="staff-login" class="btn staff-login" href="/ui/login/">직원 로그인</a>
      </div>
    </header>

    <main class="layout">
      <section class="chat-col">
        <div id="notice" class="notice" role="status" hidden></div>
        <section id="desk" class="desk-panel" aria-label="회원 로그인·대출·반납·희망도서" hidden>
          <div class="desk-head">
            <div id="desk-tabs" class="desk-tabs">
              <button type="button" class="desk-tab" data-mode="borrow">빌리기</button>
              <button type="button" class="desk-tab" data-mode="return">반납하기</button>
            </div>
            <button type="button" id="desk-close" class="desk-close" aria-label="닫기">×</button>
          </div>
          <form id="desk-form" class="desk-form" autocomplete="off">
            <label id="label-phone">휴대폰 번호 <small>숫자만 적어도 돼요</small>
              <input id="in-phone" type="tel" inputmode="numeric" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false">
            </label>
            <label id="label-accession">등록번호 <small>책 뒤 바코드 아래 번호</small>
              <input id="in-accession" type="text" maxlength="50" autocomplete="off" autocapitalize="off" spellcheck="false">
            </label>
            <label id="label-title">서명
              <input id="in-title" type="text" maxlength="200" autocomplete="off" spellcheck="false">
            </label>
            <label id="label-author">저자 <small>모르면 비워 두세요</small>
              <input id="in-author" type="text" maxlength="100" autocomplete="off" spellcheck="false">
            </label>
            <label id="label-isbn">ISBN <small>모르면 비워 두세요</small>
              <input id="in-isbn" type="text" inputmode="numeric" maxlength="20" autocomplete="off" spellcheck="false">
            </label>
            <button type="submit" id="desk-submit" class="send"></button>
          </form>
          <p id="desk-result" class="desk-result" role="status"></p>
        </section>
        <div id="empty" class="empty">
          <h1>찾는 책 제목이나 궁금한 것을 물어보세요</h1>
          <p>책 이름을 입력하면 후보가 나오고, 문장으로 물어보면 사서가 도서관 책에서 골라 드려요.</p>
        </div>
        <div id="thread" class="thread" aria-live="polite"></div>
        <form id="composer" class="composer" autocomplete="off">
          <ul id="suggest" class="suggest" role="listbox" hidden></ul>
          <div class="field">
            <input id="input" type="text" maxlength="500" placeholder="책 제목, 저자, 또는 궁금한 것" aria-label="질문 입력" autocomplete="off">
            <button type="submit" id="send" class="send">보내기</button>
          </div>
          <p class="privacy">이름, 전화번호 같은 개인정보는 적지 마세요.</p>
        </form>
      </section>

      <aside id="basket" class="basket" aria-label="담은 책" hidden>
        <h2>담은 책</h2>
        <p id="basket-empty" class="basket-empty">마음에 드는 책을 담아 두면 서가를 찾아갈 때 편해요.</p>
        <ul id="basket-list"></ul>
        <button type="button" id="basket-clear" class="btn basket-clear" hidden>모두 빼기</button>
      </aside>
    </main>
  </div>
  <button type="button" id="start-screen" class="start-screen">
    <span class="start-title">AI 사서</span>
    <span class="start-hint">화면을 눌러 시작하세요</span>
  </button>
  <div id="clear-warning" class="clear-warning" role="status" aria-live="polite" hidden>
    <span id="clear-warning-text"></span>
    <button type="button" id="clear-warning-keep" class="btn">계속 쓰기</button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
