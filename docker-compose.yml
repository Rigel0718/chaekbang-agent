services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaekbang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaekbang}
      POSTGRES_DB: ${POSTGRES_DB:-chaekbang}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 로컬 임베딩 서버(TEI). `docker compose --profile embedding up -d embedder`로만 뜬다.
  # 처음 띄울 때 모델(약 2.3GB)을 볼륨에 내려받는다. 메모리를 약 4GB 쓴다.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    profiles: ["embedding"]
    entrypoint: ["sh", "/start.sh"]
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-dragonkue/snowflake-arctic-embed-l-v2.0-ko}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-512}
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8090}:80"
    volumes:
      - tei-data:/data
      - ./docker/embedder/start.sh:/start.sh:ro

volumes:
  pgdata:
  tei-data:
